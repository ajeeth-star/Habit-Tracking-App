# XcodeGen project definition — the source of truth for the Xcode project.
# After changing this file (or adding/removing files), run: xcodegen generate
name: HabitApp

options:
  bundleIdPrefix: com.ajeethsrinivasan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only

targets:
  HabitApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DesignSystem
      - path: Models
      - path: Views
      - path: Services
      - path: Resources
    excludes:
      - "**/.gitkeep"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HabitApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Take a photo to prove you completed a habit.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajeethsrinivasan.habitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Colors are used through Color.app (DesignSystem/AppColors.swift), not generated symbols.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

  HabitAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: HabitApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajeethsrinivasan.habitapp.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HabitApp:
    build:
      targets:
        HabitApp: all
        HabitAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HabitAppTests
